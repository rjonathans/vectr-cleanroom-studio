<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectrClean Studio - Editor Vetorial</title>
  <script>
    const cdn_fa = 'https://' + 'cdn' + 'js.cloud' + 'flare' + '.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = cdn_fa; document.head.appendChild(l);
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; user-select: none; }
    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .logo-title { font-weight: 700; font-size: 16px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: linear-gradient(135deg, #2563eb, #6366f1); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: white; }
    .top-actions { display: flex; align-items: center; gap: 4px; background: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid #334155; font-size: 12px; }
    .action-btn { padding: 4px 8px; background: transparent; border: none; color: #cbd5e1; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .action-btn:hover { background: #334155; color: white; }
    .divider { height: 16px; width: 1px; background: #334155; margin: 0 4px; }
    .btn-primary { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #e2e8f0; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .btn-secondary:hover { background: #475569; }
    .main-wrapper { display: flex; flex: 1; overflow: hidden; }
    aside.tools-left { width: 48px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; flex-shrink: 0; }
    .tool-btn { width: 36px; height: 36px; border-radius: 6px; border: none; background: transparent; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .tool-btn:hover { background: #334155; color: #f8fafc; }
    .tool-btn.active { background: #2563eb; color: white; }
    aside.sidebar-left { width: 240px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; flex-shrink: 0; font-size: 12px; }
    .tab-row { display: flex; border-bottom: 1px solid #334155; background: #0f172a; }
    .tab-btn { flex: 1; padding: 8px; text-align: center; border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: 12px; font-weight: 600; }
    .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; background: #1e293b; }
    .tab-pane { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .tab-pane.hidden { display: none; }
    main.canvas-main { flex: 1; display: flex; flex-direction: column; background: #020617; position: relative; overflow: hidden; }
    .ruler-top { height: 20px; background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0; }
    .canvas-inner { flex: 1; display: flex; position: relative; overflow: hidden; }
    .ruler-left { width: 20px; background: #1e293b; border-right: 1px solid #334155; flex-shrink: 0; }
    .svg-wrap { flex: 1; position: relative; overflow: hidden; background-color: #030712; background-image: radial-gradient(#374151 1px, transparent 1px); background-size: 20px 20px; }
    aside.inspector-right { width: 280px; background: #1e293b; border-left: 1px solid #334155; padding: 12px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex-shrink: 0; font-size: 12px; }
    .inspector-title { font-weight: 700; font-size: 13px; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .inspector-sec { border-bottom: 1px solid #334155; padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sec-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field-col { display: flex; flex-direction: column; gap: 2px; }
    .field-col label { color: #94a3b8; font-size: 11px; }
    input[type="number"], input[type="text"], select { background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; width: 100%; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; width: 360px; display: flex; flex-direction: column; gap: 12px; font-size: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 8px; font-weight: 700; font-size: 14px; color: white; }
    .rule-tick { stroke: #4b5563; stroke-width: 1; }
    .rule-text { fill: #9ca3af; font-size: 9px; font-family: sans-serif; }
    .sample-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sample-btn { padding: 10px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; text-align: center; }
    .sample-btn:hover { background: #475569; }
  </style>
</head>
<body>

  <!-- TOP TOOLBAR -->
  <header>
    <div class="logo-title">
      <div class="logo-icon">V</div>
      <span>VectrClean Studio</span>
    </div>

    <!-- Actions -->
    <div class="top-actions">
      <button id="btn-undo" class="action-btn" title="Desfazer"><i class="fa-solid fa-rotate-left"></i></button>
      <button id="btn-redo" class="action-btn" title="Refazer"><i class="fa-solid fa-rotate-right"></i></button>
      <div class="divider"></div>
      <button id="btn-union" class="action-btn"><i class="fa-solid fa-shapes"></i> Unir</button>
      <button id="btn-subtract" class="action-btn"><i class="fa-solid fa-minus-square"></i> Subtrair</button>
      <button id="btn-intersect" class="action-btn"><i class="fa-solid fa-circle-half-stroke"></i> Intersec</button>
      <button id="btn-exclude" class="action-btn"><i class="fa-solid fa-border-none"></i> Excluir</button>
      <div class="divider"></div>
      <button id="align-left" class="action-btn"><i class="fa-solid fa-align-left"></i></button>
      <button id="align-center" class="action-btn"><i class="fa-solid fa-align-center"></i></button>
      <button id="align-right" class="action-btn"><i class="fa-solid fa-align-right"></i></button>
      <button id="align-top" class="action-btn"><i class="fa-solid fa-arrows-up-to-line"></i></button>
      <button id="align-middle" class="action-btn"><i class="fa-solid fa-grip-lines-vertical"></i></button>
      <button id="align-bottom" class="action-btn"><i class="fa-solid fa-arrows-down-to-line"></i></button>
      <div class="divider"></div>
      <button id="btn-dup" class="action-btn"><i class="fa-solid fa-clone"></i></button>
      <button id="btn-del" class="action-btn" style="color:#f87171;"><i class="fa-solid fa-trash"></i></button>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="btn-import-modal" class="btn-secondary"><i class="fa-solid fa-file-import"></i> Importar</button>
      <button id="btn-export-modal" class="btn-primary"><i class="fa-solid fa-file-export"></i> Exportar</button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="main-wrapper">
    
    <!-- LEFT TOOL PALETTE -->
    <aside class="tools-left">
      <button data-tool="select" class="tool-btn active" title="Selecao (V)"><i class="fa-solid fa-mouse-pointer"></i></button>
      <button data-tool="node" class="tool-btn" title="Edicao de Nos (A)"><i class="fa-solid fa-bezier-curve"></i></button>
      <div class="divider" style="width:24px; height:1px; margin:4px 0;"></div>
      <button data-tool="pen" class="tool-btn" title="Caneta Bezier (P)"><i class="fa-solid fa-pen-nib"></i></button>
      <button data-tool="pencil" class="tool-btn" title="Lapis Livre (N)"><i class="fa-solid fa-pencil"></i></button>
      <div class="divider" style="width:24px; height:1px; margin:4px 0;"></div>
      <button data-tool="rect" class="tool-btn" title="Retangulo (R)"><i class="fa-regular fa-square"></i></button>
      <button data-tool="ellipse" class="tool-btn" title="Elipse (O)"><i class="fa-regular fa-circle"></i></button>
      <button data-tool="polygon" class="tool-btn" title="Poligono (Y)"><i class="fa-solid fa-draw-polygon"></i></button>
      <button data-tool="star" class="tool-btn" title="Estrela (S)"><i class="fa-regular fa-star"></i></button>
      <button data-tool="line" class="tool-btn" title="Linha (L)"><i class="fa-solid fa-minus"></i></button>
      <button data-tool="text" class="tool-btn" title="Texto (T)"><i class="fa-solid fa-font"></i></button>
      <div class="divider" style="width:24px; height:1px; margin:4px 0;"></div>
      <button data-tool="hand" class="tool-btn" title="Mover Artboard / Pan (H)"><i class="fa-solid fa-hand"></i></button>
    </aside>

    <!-- LEFT SIDEBAR TABS -->
    <aside class="sidebar-left">
      <div class="tab-row">
        <button id="tab-btn-layers" class="tab-btn active">Camadas</button>
        <button id="tab-btn-library" class="tab-btn">Biblioteca</button>
        <button id="tab-btn-page" class="tab-btn">Pagina</button>
      </div>

      <div id="tab-layers" class="tab-pane">
        <div id="layers-list" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>

      <div id="tab-library" class="tab-pane hidden" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <button class="lib-icon-btn sample-btn" data-icon="star"><i class="fa-solid fa-star text-yellow-400"></i><br>Estrela</button>
        <button class="lib-icon-btn sample-btn" data-icon="heart"><i class="fa-solid fa-heart text-red-500"></i><br>Coracao</button>
        <button class="lib-icon-btn sample-btn" data-icon="gear"><i class="fa-solid fa-gear text-blue-400"></i><br>Engrenagem</button>
        <button class="lib-icon-btn sample-btn" data-icon="house"><i class="fa-solid fa-house text-green-400"></i><br>Casa</button>
      </div>

      <div id="tab-page" class="tab-pane hidden">
        <div class="field-col">
          <label>Unidade de Medida</label>
          <select id="select-unit">
            <option value="px">Pixels (px)</option>
            <option value="mm">Milimetros (mm)</option>
            <option value="cm">Centimetros (cm)</option>
            <option value="in">Polegadas (in)</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- CANVAS AREA -->
    <main class="canvas-main">
      <div class="ruler-top"><svg id="ruler-h" style="width:100%; height:100%;"></svg></div>
      <div class="canvas-inner">
        <div class="ruler-left"><svg id="ruler-v" style="width:100%; height:100%;"></svg></div>
        <div class="svg-wrap">
          <svg id="main-svg" style="width:100%; height:100%; display:block; cursor:crosshair;">
            <defs>
              <pattern id="artboard-grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5"/>
              </pattern>
            </defs>
            <g id="viewport-group" transform="translate(100, 50) scale(1)">
              <rect id="artboard-rect" x="0" y="0" width="800" height="600" fill="#ffffff"/>
              <rect x="0" y="0" width="800" height="600" fill="url(#artboard-grid)" opacity="0.3" pointer-events="none"/>
              <g id="scene-container"></g>
              <g id="marquee-container"></g>
              <g id="guides-container"></g>
              <g id="gizmo-container"></g>
            </g>
          </svg>
        </div>
      </div>
    </main>

    <!-- RIGHT INSPECTOR -->
    <aside class="inspector-right">
      <div class="inspector-title">
        <span>Inspetor de Propriedades</span>
        <span id="unit-badge" style="background:#0f172a; padding:2px 6px; border-radius:4px; color:#38bdf8;">px</span>
      </div>

      <div class="inspector-sec">
        <span class="sec-label">Transformacao</span>
        <div class="grid-2">
          <div class="field-col"><label>X</label><input type="number" id="inp-x"></div>
          <div class="field-col"><label>Y</label><input type="number" id="inp-y"></div>
          <div class="field-col"><label>Largura (W)</label><input type="number" id="inp-w"></div>
          <div class="field-col"><label>Altura (H)</label><input type="number" id="inp-h"></div>
          <div class="field-col"><label>Rotacao (°)</label><input type="number" id="inp-rot"></div>
          <div class="field-col"><label>Raio de Canto</label><input type="number" id="inp-radius"></div>
        </div>
        <button id="btn-convert-curves" class="btn-secondary" style="margin-top:4px; justify-center;"><i class="fa-solid fa-bezier-curve"></i> Converter em Curvas</button>
      </div>

      <div class="inspector-sec">
        <span class="sec-label">Preenchimento</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="color" id="fill-color" style="width:36px; height:36px; border:none; background:transparent; cursor:pointer;">
          <input type="text" id="fill-hex" value="#3B82F6">
        </div>
      </div>

      <div class="inspector-sec">
        <span class="sec-label">Contorno / Tracado</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="color" id="stroke-color" style="width:36px; height:36px; border:none; background:transparent; cursor:pointer;">
          <input type="number" id="stroke-width" value="2" min="0">
        </div>
      </div>
    </aside>
  </div>

  <!-- MODAL IMPORT -->
  <div id="modal-import" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span>Importar Formato Vetorial</span>
        <button class="btn-close-modal" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:16px;">&times;</button>
      </div>
      <p style="color:#94a3b8; margin:0;">Selecione uma amostra de teste de 1 clique:</p>
      <div class="sample-grid">
        <button id="import-sample-ai" class="sample-btn" style="color:#60a5fa;">Amostra .AI</button>
        <button id="import-sample-cdr" class="sample-btn" style="color:#4ade80;">Amostra .CDR</button>
        <button id="import-sample-pdf" class="sample-btn" style="color:#f87171;">Amostra .PDF</button>
        <button id="import-sample-dxf" class="sample-btn" style="color:#c084fc;">Amostra .DXF</button>
      </div>
    </div>
  </div>

  <!-- MODAL EXPORT -->
  <div id="modal-export" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span>Exportar Arte Vetorial</span>
        <button class="btn-close-modal" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:16px;">&times;</button>
      </div>
      <div class="field-col">
        <label>Formato:</label>
        <select id="export-format">
          <option value="svg">SVG (.svg)</option>
          <option value="eps">EPS (.eps)</option>
          <option value="dxf">DXF (.dxf)</option>
          <option value="png">PNG (.png)</option>
          <option value="jpg">JPG (.jpg)</option>
          <option value="json">JSON (.json)</option>
        </select>
      </div>
      <button id="btn-do-export" class="btn-primary" style="justify-content:center;">Baixar Arquivo</button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const SVG_NS = 'http://' + 'www.w3' + '.org/2000/svg';

    const state = {
      objects: [], selectedIds: [], activeTool: 'select',
      unit: 'px', dpi: 96, artboard: { width: 800, height: 600 },
      panX: 100, panY: 50, zoom: 1.0,
      mode: null, activeHandle: null, dragStart: { x: 0, y: 0 },
      initialObjStates: {}, activePenPath: null, pencilPoints: [], marqueeStart: { x: 0, y: 0 },
      history: [], historyIndex: -1
    };

    function pxToUnit(px) {
      if (state.unit === 'mm') return parseFloat((px * 25.4 / state.dpi).toFixed(1));
      if (state.unit === 'cm') return parseFloat((px * 2.54 / state.dpi).toFixed(2));
      if (state.unit === 'in') return parseFloat((px / state.dpi).toFixed(2));
      return Math.round(px);
    }

    function unitToPx(val) {
      const v = parseFloat(val) || 0;
      if (state.unit === 'mm') return (v * state.dpi) / 25.4;
      if (state.unit === 'cm') return (v * state.dpi) / 2.54;
      if (state.unit === 'in') return v * state.dpi;
      return v;
    }

    function getArtboardCoords(e) {
      const svg = document.getElementById('main-svg');
      const rect = svg.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - state.panX) / state.zoom,
        y: (e.clientY - rect.top - state.panY) / state.zoom
      };
    }

    function saveHistory() {
      const snapshot = JSON.stringify(state.objects);
      if (state.historyIndex < state.history.length - 1) {
        state.history = state.history.slice(0, state.historyIndex + 1);
      }
      state.history.push(snapshot);
      state.historyIndex = state.history.length - 1;
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        state.objects = JSON.parse(state.history[state.historyIndex]);
        renderScene(); renderLayers(); updateInspector();
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        state.objects = JSON.parse(state.history[state.historyIndex]);
        renderScene(); renderLayers(); updateInspector();
      }
    }

    function initDefaultObjects() {
      state.objects = [
        { id: 'rect-1', type: 'rect', x: 150, y: 120, width: 220, height: 160, rotation: 0, cornerRadius: 16, fill: '#3b82f6', stroke: '#1e40af', strokeWidth: 3, filter: { opacity: 1 }, visible: true, locked: false },
        { id: 'ellipse-1', type: 'ellipse', x: 450, y: 150, width: 180, height: 180, rotation: 0, fill: '#ec4899', stroke: '#9d174d', strokeWidth: 3, filter: { opacity: 0.9 }, visible: true, locked: false },
        { id: 'star-1', type: 'star', x: 250, y: 350, width: 160, height: 160, rotation: 0, fill: '#f59e0b', stroke: '#b45309', strokeWidth: 2, filter: { opacity: 1 }, visible: true, locked: false }
      ];
      saveHistory();
    }

    function renderScene() {
      const container = document.getElementById('scene-container');
      container.innerHTML = '';

      state.objects.forEach(obj => {
        if (!obj.visible) return;
        let el;
        const transformStr = `rotate(${obj.rotation || 0}, ${obj.x + obj.width/2}, ${obj.y + obj.height/2})`;

        if (obj.type === 'rect') {
          el = document.createElementNS(SVG_NS, 'rect');
          el.setAttribute('x', obj.x); el.setAttribute('y', obj.y);
          el.setAttribute('width', Math.max(1, obj.width)); el.setAttribute('height', Math.max(1, obj.height));
          el.setAttribute('rx', obj.cornerRadius || 0); el.setAttribute('ry', obj.cornerRadius || 0);
        } else if (obj.type === 'ellipse') {
          el = document.createElementNS(SVG_NS, 'ellipse');
          el.setAttribute('cx', obj.x + obj.width/2); el.setAttribute('cy', obj.y + obj.height/2);
          el.setAttribute('rx', Math.max(1, obj.width/2)); el.setAttribute('ry', Math.max(1, obj.height/2));
        } else if (obj.type === 'star') {
          el = document.createElementNS(SVG_NS, 'polygon');
          const pts = []; const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
          const outerR = obj.width/2, innerR = outerR * 0.4;
          for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? outerR : innerR;
            const a = (i * Math.PI / 5) - Math.PI / 2;
            pts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
          }
          el.setAttribute('points', pts.join(' '));
        } else if (obj.type === 'polygon') {
          el = document.createElementNS(SVG_NS, 'polygon');
          const pts = []; const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2, r = obj.width/2;
          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI / 3);
            pts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
          }
          el.setAttribute('points', pts.join(' '));
        } else if (obj.type === 'line') {
          el = document.createElementNS(SVG_NS, 'line');
          el.setAttribute('x1', obj.x); el.setAttribute('y1', obj.y);
          el.setAttribute('x2', obj.x + obj.width); el.setAttribute('y2', obj.y + obj.height);
        } else if (obj.type === 'text') {
          el = document.createElementNS(SVG_NS, 'text');
          el.setAttribute('x', obj.x); el.setAttribute('y', obj.y + (obj.height || 24));
          el.setAttribute('font-size', '28'); el.setAttribute('font-family', 'sans-serif'); el.setAttribute('font-weight', 'bold');
          el.textContent = obj.text || 'Texto';
        } else if (['path', 'pencil', 'pen', 'icon'].includes(obj.type)) {
          el = document.createElementNS(SVG_NS, 'path');
          let d = '';
          if (obj.segments && obj.segments.length > 0) {
            d = `M ${obj.segments[0].x} ${obj.segments[0].y}`;
            for (let i = 1; i < obj.segments.length; i++) {
              const seg = obj.segments[i], prev = obj.segments[i-1];
              if (prev.handleOut && seg.handleIn) {
                d += ` C ${prev.x + prev.handleOut.x} ${prev.y + prev.handleOut.y}, ${seg.x + seg.handleIn.x} ${seg.y + seg.handleIn.y}, ${seg.x} ${seg.y}`;
              } else {
                d += ` L ${seg.x} ${seg.y}`;
              }
            }
            if (obj.closed) d += ' Z';
          } else {
            d = obj.pathData || `M ${obj.x} ${obj.y} L ${obj.x + obj.width} ${obj.y + obj.height}`;
          }
          el.setAttribute('d', d);
        }

        if (el) {
          el.setAttribute('transform', transformStr);
          el.setAttribute('fill', obj.fill || 'none');
          el.setAttribute('stroke', obj.stroke || 'none');
          el.setAttribute('stroke-width', obj.strokeWidth || 0);
          el.setAttribute('opacity', obj.filter ? obj.filter.opacity : 1);
          el.setAttribute('data-node-id', obj.id);
          el.style.cursor = 'pointer';
          container.appendChild(el);
        }
      });

      renderGizmos();
      updateViewport();
    }

    function renderGizmos() {
      const gizmoGroup = document.getElementById('gizmo-container');
      gizmoGroup.innerHTML = '';
      if (state.selectedIds.length === 0) return;

      const selectedObjs = state.objects.filter(o => state.selectedIds.includes(o.id));
      if (selectedObjs.length === 0) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      selectedObjs.forEach(o => {
        minX = Math.min(minX, o.x); minY = Math.min(minY, o.y);
        maxX = Math.max(maxX, o.x + o.width); maxY = Math.max(maxY, o.y + o.height);
      });
      const w = maxX - minX, h = maxY - minY;

      const bbox = document.createElementNS(SVG_NS, 'rect');
      bbox.setAttribute('x', minX); bbox.setAttribute('y', minY);
      bbox.setAttribute('width', Math.max(1, w)); bbox.setAttribute('height', Math.max(1, h));
      bbox.setAttribute('fill', 'none'); bbox.setAttribute('stroke', '#3b82f6');
      bbox.setAttribute('stroke-width', '1.5'); bbox.setAttribute('stroke-dasharray', '4 4');
      bbox.setAttribute('pointer-events', 'none');
      gizmoGroup.appendChild(bbox);

      const handles = [
        { type: 'nw', x: minX, y: minY, cursor: 'nwse-resize' },
        { type: 'n',  x: minX + w/2, y: minY, cursor: 'ns-resize' },
        { type: 'ne', x: maxX, y: minY, cursor: 'nesw-resize' },
        { type: 'e',  x: maxX, y: minY + h/2, cursor: 'ew-resize' },
        { type: 'se', x: maxX, y: maxY, cursor: 'nwse-resize' },
        { type: 's',  x: minX + w/2, y: maxY, cursor: 'ns-resize' },
        { type: 'sw', x: minX, y: maxY, cursor: 'nesw-resize' },
        { type: 'w',  x: minX, y: minY + h/2, cursor: 'ew-resize' }
      ];

      handles.forEach(hd => {
        const hEl = document.createElementNS(SVG_NS, 'rect');
        hEl.setAttribute('x', hd.x - 4); hEl.setAttribute('y', hd.y - 4);
        hEl.setAttribute('width', '8'); hEl.setAttribute('height', '8');
        hEl.setAttribute('fill', '#ffffff'); hEl.setAttribute('stroke', '#3b82f6');
        hEl.setAttribute('stroke-width', '1.5'); hEl.setAttribute('data-resize-handle', hd.type);
        hEl.style.cursor = hd.cursor;
        gizmoGroup.appendChild(hEl);
      });

      const rotLine = document.createElementNS(SVG_NS, 'line');
      rotLine.setAttribute('x1', minX + w/2); rotLine.setAttribute('y1', minY);
      rotLine.setAttribute('x2', minX + w/2); rotLine.setAttribute('y2', minY - 24);
      rotLine.setAttribute('stroke', '#3b82f6'); rotLine.setAttribute('stroke-width', '1.5');
      gizmoGroup.appendChild(rotLine);

      const rotEl = document.createElementNS(SVG_NS, 'circle');
      rotEl.setAttribute('cx', minX + w/2); rotEl.setAttribute('cy', minY - 24);
      rotEl.setAttribute('r', '5'); rotEl.setAttribute('fill', '#3b82f6');
      rotEl.setAttribute('stroke', '#ffffff'); rotEl.setAttribute('stroke-width', '1.5');
      rotEl.setAttribute('data-rotate-handle', 'true'); rotEl.style.cursor = 'grab';
      gizmoGroup.appendChild(rotEl);

      if (selectedObjs.length === 1 && selectedObjs[0].type === 'rect') {
        const obj = selectedObjs[0];
        const r = Math.min(obj.cornerRadius || 0, Math.min(w, h)/2);
        const cornerEl = document.createElementNS(SVG_NS, 'circle');
        cornerEl.setAttribute('cx', obj.x + r + 8); cornerEl.setAttribute('cy', obj.y + 8);
        cornerEl.setAttribute('r', '4.5'); cornerEl.setAttribute('fill', '#facc15');
        cornerEl.setAttribute('stroke', '#1e3a8a'); cornerEl.setAttribute('stroke-width', '1');
        cornerEl.setAttribute('data-corner-handle', 'true'); cornerEl.style.cursor = 'pointer';
        gizmoGroup.appendChild(cornerEl);
      }

      if (state.activeTool === 'node' && selectedObjs.length === 1) {
        const obj = selectedObjs[0];
        if (obj.segments) {
          obj.segments.forEach((seg, idx) => {
            const anc = document.createElementNS(SVG_NS, 'circle');
            anc.setAttribute('cx', seg.x); anc.setAttribute('cy', seg.y);
            anc.setAttribute('r', '5'); anc.setAttribute('fill', '#3b82f6');
            anc.setAttribute('stroke', '#ffffff'); anc.setAttribute('stroke-width', '1.5');
            anc.setAttribute('data-gizmo', 'anchor'); anc.setAttribute('data-index', idx);
            anc.style.cursor = 'move';
            gizmoGroup.appendChild(anc);
          });
        }
      }
    }

    function updateViewport() {
      const vp = document.getElementById('viewport-group');
      vp.setAttribute('transform', `translate(${state.panX}, ${state.panY}) scale(${state.zoom})`);
      renderRulers();
    }

    function renderRulers() {
      const rH = document.getElementById('ruler-h'), rV = document.getElementById('ruler-v');
      if (!rH || !rV) return;
      rH.innerHTML = ''; rV.innerHTML = '';
      const w = rH.clientWidth || 800, h = rV.clientHeight || 600;
      const step = 50 * state.zoom;

      for (let x = 0; x < w; x += step) {
        const val = pxToUnit((x - state.panX) / state.zoom);
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', x); line.setAttribute('y1', 12);
        line.setAttribute('x2', x); line.setAttribute('y2', 20);
        line.setAttribute('class', 'rule-tick'); rH.appendChild(line);

        const txt = document.createElementNS(SVG_NS, 'text');
        txt.setAttribute('x', x + 2); txt.setAttribute('y', 10);
        txt.setAttribute('class', 'rule-text'); txt.textContent = val;
        rH.appendChild(txt);
      }

      for (let y = 0; y < h; y += step) {
        const val = pxToUnit((y - state.panY) / state.zoom);
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', 12); line.setAttribute('y1', y);
        line.setAttribute('x2', 20); line.setAttribute('y2', y);
        line.setAttribute('class', 'rule-tick'); rV.appendChild(line);

        const txt = document.createElementNS(SVG_NS, 'text');
        txt.setAttribute('x', 2); txt.setAttribute('y', y + 10);
        txt.setAttribute('class', 'rule-text'); txt.textContent = val;
        rV.appendChild(txt);
      }
    }

    const mainSvg = document.getElementById('main-svg');

    mainSvg.addEventListener('pointerdown', (e) => {
      const pt = getArtboardCoords(e);
      const target = e.target;

      const resizeType = target.getAttribute('data-resize-handle');
      if (resizeType) {
        state.mode = 'resizing'; state.activeHandle = resizeType;
        state.dragStart = pt; state.initialObjStates = {};
        state.selectedIds.forEach(id => { const o = state.objects.find(x => x.id === id); if (o) state.initialObjStates[id] = { ...o }; });
        mainSvg.setPointerCapture(e.pointerId); return;
      }

      if (target.getAttribute('data-rotate-handle')) {
        state.mode = 'rotating'; state.dragStart = pt; state.initialObjStates = {};
        state.selectedIds.forEach(id => { const o = state.objects.find(x => x.id === id); if (o) state.initialObjStates[id] = { ...o }; });
        mainSvg.setPointerCapture(e.pointerId); return;
      }

      if (target.getAttribute('data-corner-handle')) {
        state.mode = 'corner-radius'; state.dragStart = pt; state.initialObjStates = {};
        state.selectedIds.forEach(id => { const o = state.objects.find(x => x.id === id); if (o) state.initialObjStates[id] = { ...o }; });
        mainSvg.setPointerCapture(e.pointerId); return;
      }

      const gizmoType = target.getAttribute('data-gizmo');
      if (gizmoType) {
        state.mode = 'dragging-gizmo'; state.activeHandle = { type: gizmoType, index: parseInt(target.getAttribute('data-index')) };
        state.dragStart = pt; mainSvg.setPointerCapture(e.pointerId); return;
      }

      if (state.activeTool === 'hand' || e.button === 1) {
        state.mode = 'panning'; state.dragStart = { x: e.clientX, y: e.clientY };
        mainSvg.setPointerCapture(e.pointerId); return;
      }

      if (['rect', 'ellipse', 'polygon', 'star', 'line'].includes(state.activeTool)) {
        const newObj = {
          id: state.activeTool + '-' + Date.now(), type: state.activeTool,
          x: pt.x, y: pt.y, width: 1, height: 1, rotation: 0, cornerRadius: 0,
          fill: '#3b82f6', stroke: '#1d4ed8', strokeWidth: 2, filter: { opacity: 1 }, visible: true, locked: false
        };
        state.objects.push(newObj); state.selectedIds = [newObj.id];
        state.mode = 'drawing-shape'; state.dragStart = pt;
        renderScene(); mainSvg.setPointerCapture(e.pointerId); return;
      }

      if (state.activeTool === 'pencil') {
        const newObj = {
          id: 'path-' + Date.now(), type: 'pencil', x: pt.x, y: pt.y, width: 1, height: 1, rotation: 0,
          segments: [{ x: pt.x, y: pt.y }], fill: 'none', stroke: '#3b82f6', strokeWidth: 3, filter: { opacity: 1 }, visible: true, locked: false
        };
        state.objects.push(newObj); state.selectedIds = [newObj.id];
        state.mode = 'drawing-pencil'; state.dragStart = pt;
        renderScene(); mainSvg.setPointerCapture(e.pointerId); return;
      }

      if (state.activeTool === 'pen') {
        if (!state.activePenPath) {
          state.activePenPath = {
            id: 'path-' + Date.now(), type: 'pen', x: pt.x, y: pt.y, width: 1, height: 1, rotation: 0,
            segments: [{ x: pt.x, y: pt.y, handleIn: {x:0, y:0}, handleOut: {x:0, y:0} }],
            fill: 'none', stroke: '#10b981', strokeWidth: 2, filter: { opacity: 1 }, visible: true, locked: false
          };
          state.objects.push(state.activePenPath); state.selectedIds = [state.activePenPath.id];
        } else {
          state.activePenPath.segments.push({ x: pt.x, y: pt.y, handleIn: {x:0, y:0}, handleOut: {x:0, y:0} });
        }
        renderScene(); return;
      }

      if (state.activeTool === 'text') {
        const txtObj = {
          id: 'text-' + Date.now(), type: 'text', x: pt.x, y: pt.y, width: 100, height: 30, rotation: 0,
          text: 'VectrClean', fill: '#ffffff', stroke: 'none', strokeWidth: 0, filter: { opacity: 1 }, visible: true, locked: false
        };
        state.objects.push(txtObj); state.selectedIds = [txtObj.id];
        setActiveTool('select'); renderScene(); renderLayers(); updateInspector(); return;
      }

      const nodeId = target.getAttribute('data-node-id');
      if (nodeId) {
        if (e.shiftKey) {
          if (state.selectedIds.includes(nodeId)) state.selectedIds = state.selectedIds.filter(id => id !== nodeId);
          else state.selectedIds.push(nodeId);
        } else {
          if (!state.selectedIds.includes(nodeId)) state.selectedIds = [nodeId];
        }
        state.mode = 'dragging-node'; state.dragStart = pt; state.initialObjStates = {};
        state.selectedIds.forEach(id => {
          const o = state.objects.find(x => x.id === id);
          if (o) state.initialObjStates[id] = { x: o.x, y: o.y, segments: o.segments ? JSON.parse(JSON.stringify(o.segments)) : null };
        });
        renderScene(); updateInspector(); mainSvg.setPointerCapture(e.pointerId);
      } else {
        if (!e.shiftKey) state.selectedIds = [];
        state.mode = 'marquee'; state.marqueeStart = pt;
        renderScene(); updateInspector(); mainSvg.setPointerCapture(e.pointerId);
      }
    });

    mainSvg.addEventListener('pointermove', (e) => {
      if (!state.mode) return;
      const pt = getArtboardCoords(e);

      if (state.mode === 'panning') {
        state.panX += e.clientX - state.dragStart.x;
        state.panY += e.clientY - state.dragStart.y;
        state.dragStart = { x: e.clientX, y: e.clientY };
        updateViewport(); return;
      }

      if (state.mode === 'dragging-node') {
        const dx = pt.x - state.dragStart.x, dy = pt.y - state.dragStart.y;
        state.selectedIds.forEach(id => {
          const obj = state.objects.find(o => o.id === id);
          const init = state.initialObjStates[id];
          if (obj && init) {
            obj.x = Math.round(init.x + dx); obj.y = Math.round(init.y + dy);
            if (obj.segments && init.segments) {
              obj.segments = init.segments.map(s => ({ ...s, x: s.x + dx, y: s.y + dy }));
            }
          }
        });
        renderScene(); updateInspector(); return;
      }

      if (state.mode === 'resizing') {
        const dx = pt.x - state.dragStart.x, dy = pt.y - state.dragStart.y;
        state.selectedIds.forEach(id => {
          const obj = state.objects.find(o => o.id === id);
          const init = state.initialObjStates[id];
          if (!obj || !init) return;
          let newX = init.x, newY = init.y, newW = init.width, newH = init.height;

          if (state.activeHandle.includes('e')) newW = Math.max(10, init.width + dx);
          if (state.activeHandle.includes('s')) newH = Math.max(10, init.height + dy);
          if (state.activeHandle.includes('w')) { newW = Math.max(10, init.width - dx); newX = init.x + (init.width - newW); }
          if (state.activeHandle.includes('n')) { newH = Math.max(10, init.height - dy); newY = init.y + (init.height - newH); }

          obj.x = Math.round(newX); obj.y = Math.round(newY);
          obj.width = Math.round(newW); obj.height = Math.round(newH);
        });
        renderScene(); updateInspector(); return;
      }

      if (state.mode === 'rotating') {
        state.selectedIds.forEach(id => {
          const obj = state.objects.find(o => o.id === id);
          if (!obj) return;
          const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
          const angle = Math.atan2(pt.y - cy, pt.x - cx) * (180 / Math.PI) + 90;
          obj.rotation = Math.round((angle + 360) % 360);
        });
        renderScene(); updateInspector(); return;
      }

      if (state.mode === 'corner-radius') {
        state.selectedIds.forEach(id => {
          const obj = state.objects.find(o => o.id === id);
          if (!obj || obj.type !== 'rect') return;
          const dist = Math.hypot(pt.x - obj.x, pt.y - obj.y);
          obj.cornerRadius = Math.round(Math.max(0, Math.min(dist, Math.min(obj.width, obj.height)/2)));
        });
        renderScene(); updateInspector(); return;
      }

      if (state.mode === 'drawing-shape') {
        const obj = state.objects.find(o => o.id === state.selectedIds[0]);
        if (obj) {
          obj.width = Math.max(2, Math.abs(pt.x - state.dragStart.x));
          obj.height = Math.max(2, Math.abs(pt.y - state.dragStart.y));
          obj.x = Math.min(pt.x, state.dragStart.x); obj.y = Math.min(pt.y, state.dragStart.y);
          renderScene();
        }
        return;
      }

      if (state.mode === 'drawing-pencil') {
        const obj = state.objects.find(o => o.id === state.selectedIds[0]);
        if (obj && obj.segments) {
          obj.segments.push({ x: pt.x, y: pt.y });
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          obj.segments.forEach(s => { minX = Math.min(minX, s.x); minY = Math.min(minY, s.y); maxX = Math.max(maxX, s.x); maxY = Math.max(maxY, s.y); });
          obj.x = minX; obj.y = minY; obj.width = maxX - minX; obj.height = maxY - minY;
          renderScene();
        }
        return;
      }

      if (state.mode === 'marquee') {
        const mGrp = document.getElementById('marquee-container');
        const x = Math.min(pt.x, state.marqueeStart.x), y = Math.min(pt.y, state.marqueeStart.y);
        const w = Math.abs(pt.x - state.marqueeStart.x), h = Math.abs(pt.y - state.marqueeStart.y);

        mGrp.innerHTML = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-dasharray="3 3"/>`;

        state.selectedIds = state.objects.filter(o => {
          return o.x < x + w && o.x + o.width > x && o.y < y + h && o.y + o.height > y;
        }).map(o => o.id);

        renderGizmos(); updateInspector(); return;
      }
    });

    mainSvg.addEventListener('pointerup', () => {
      if (!state.mode) return;
      if (['drawing-shape', 'drawing-pencil'].includes(state.mode)) setActiveTool('select');
      if (state.mode === 'marquee') document.getElementById('marquee-container').innerHTML = '';
      state.mode = null; saveHistory(); renderScene(); renderLayers(); updateInspector();
    });

    mainSvg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      state.zoom = Math.min(5.0, Math.max(0.2, state.zoom * zoomFactor));
      updateViewport();
    });

    function setActiveTool(tool) {
      state.activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        if (btn.getAttribute('data-tool') === tool) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderGizmos();
    }

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => setActiveTool(btn.getAttribute('data-tool')));
    });

    function updateInspector() {
      const unitLbl = document.getElementById('unit-badge');
      if (unitLbl) unitLbl.textContent = state.unit;
      if (state.selectedIds.length === 0) return;
      const obj = state.objects.find(o => o.id === state.selectedIds[0]);
      if (!obj) return;

      document.getElementById('inp-x').value = pxToUnit(obj.x);
      document.getElementById('inp-y').value = pxToUnit(obj.y);
      document.getElementById('inp-w').value = pxToUnit(obj.width);
      document.getElementById('inp-h').value = pxToUnit(obj.height);
      document.getElementById('inp-rot').value = obj.rotation || 0;
      document.getElementById('inp-radius').value = obj.cornerRadius || 0;

      if (obj.fill && obj.fill.startsWith('#')) {
        document.getElementById('fill-color').value = obj.fill;
        document.getElementById('fill-hex').value = obj.fill.toUpperCase();
      }
      if (obj.stroke && obj.stroke.startsWith('#')) {
        document.getElementById('stroke-color').value = obj.stroke;
      }
      document.getElementById('stroke-width').value = obj.strokeWidth || 0;
    }

    document.getElementById('inp-x').addEventListener('change', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.x = unitToPx(e.target.value); renderScene(); } }
    });
    document.getElementById('inp-y').addEventListener('change', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.y = unitToPx(e.target.value); renderScene(); } }
    });
    document.getElementById('inp-w').addEventListener('change', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.width = unitToPx(e.target.value); renderScene(); } }
    });
    document.getElementById('inp-h').addEventListener('change', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.height = unitToPx(e.target.value); renderScene(); } }
    });
    document.getElementById('inp-rot').addEventListener('change', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.rotation = parseFloat(e.target.value) || 0; renderScene(); } }
    });
    document.getElementById('inp-radius').addEventListener('change', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.cornerRadius = parseFloat(e.target.value) || 0; renderScene(); } }
    });
    document.getElementById('fill-color').addEventListener('input', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.fill = e.target.value; document.getElementById('fill-hex').value = e.target.value.toUpperCase(); renderScene(); } }
    });
    document.getElementById('stroke-color').addEventListener('input', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.stroke = e.target.value; renderScene(); } }
    });
    document.getElementById('stroke-width').addEventListener('input', (e) => {
      if (state.selectedIds[0]) { const obj = state.objects.find(o => o.id === state.selectedIds[0]); if (obj) { obj.strokeWidth = parseFloat(e.target.value) || 0; renderScene(); } }
    });

    function renderLayers() {
      const list = document.getElementById('layers-list');
      if (!list) return;
      list.innerHTML = '';

      state.objects.slice().reverse().forEach(obj => {
        const item = document.createElement('div');
        const isSel = state.selectedIds.includes(obj.id);
        item.style.cssText = `padding:8px; border-radius:6px; border:1px solid ${isSel ? '#2563eb' : '#334155'}; background:${isSel ? '#1e3a8a' : '#1e293b'}; color:${isSel ? '#ffffff' : '#cbd5e1'}; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-size:11px;`;
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:10px; height:10px; border-radius:2px; background:${obj.fill || '#2563eb'}; display:inline-block;"></span>
            <span style="font-weight:600; text-transform:capitalize;">${obj.type} (${obj.id})</span>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="btn-vis" style="background:none; border:none; color:#cbd5e1; cursor:pointer;"><i class="fa-solid ${obj.visible ? 'fa-eye' : 'fa-eye-slash'}"></i></button>
            <button class="btn-del-layer" style="background:none; border:none; color:#f87171; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;

        item.addEventListener('click', (e) => {
          if (e.target.closest('.btn-vis')) { obj.visible = !obj.visible; renderScene(); renderLayers(); return; }
          if (e.target.closest('.btn-del-layer')) {
            state.objects = state.objects.filter(o => o.id !== obj.id);
            state.selectedIds = state.selectedIds.filter(id => id !== obj.id);
            renderScene(); renderLayers(); updateInspector(); return;
          }
          state.selectedIds = [obj.id]; renderScene(); renderLayers(); updateInspector();
        });

        list.appendChild(item);
      });
    }

    const tabBtns = { layers: document.getElementById('tab-btn-layers'), library: document.getElementById('tab-btn-library'), page: document.getElementById('tab-btn-page') };
    const tabPanels = { layers: document.getElementById('tab-layers'), library: document.getElementById('tab-library'), page: document.getElementById('tab-page') };

    Object.keys(tabBtns).forEach(key => {
      tabBtns[key].addEventListener('click', () => {
        Object.keys(tabBtns).forEach(k => {
          tabBtns[k].classList.remove('active');
          tabPanels[k].classList.add('hidden');
        });
        tabBtns[key].classList.add('active');
        tabPanels[key].classList.remove('hidden');
      });
    });

    document.querySelectorAll('.lib-icon-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const newObj = {
          id: 'icon-' + Date.now(), type: 'icon', x: 350, y: 220, width: 100, height: 100, rotation: 0,
          fill: '#3b82f6', stroke: '#1d4ed8', strokeWidth: 2,
          segments: [{ x: 350, y: 220 }, { x: 450, y: 220 }, { x: 450, y: 320 }, { x: 350, y: 320 }],
          filter: { opacity: 1 }, visible: true, locked: false
        };
        state.objects.push(newObj); state.selectedIds = [newObj.id];
        renderScene(); renderLayers(); updateInspector();
      });
    });

    document.getElementById('select-unit').addEventListener('change', (e) => {
      state.unit = e.target.value; updateInspector(); renderRulers();
    });

    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-redo').addEventListener('click', redo);

    document.getElementById('btn-del').addEventListener('click', () => {
      if (state.selectedIds.length > 0) {
        state.objects = state.objects.filter(o => !state.selectedIds.includes(o.id));
        state.selectedIds = [];
        saveHistory(); renderScene(); renderLayers(); updateInspector();
      }
    });

    document.getElementById('btn-dup').addEventListener('click', () => {
      if (state.selectedIds.length > 0) {
        const newIds = [];
        state.selectedIds.forEach(id => {
          const obj = state.objects.find(o => o.id === id);
          if (obj) {
            const clone = JSON.parse(JSON.stringify(obj));
            clone.id = obj.type + '-' + Date.now() + Math.random().toString(36).substr(2, 4);
            clone.x += 20; clone.y += 20;
            state.objects.push(clone); newIds.push(clone.id);
          }
        });
        state.selectedIds = newIds; saveHistory(); renderScene(); renderLayers(); updateInspector();
      }
    });

    document.getElementById('btn-convert-curves').addEventListener('click', () => {
      if (state.selectedIds.length === 1) {
        const obj = state.objects.find(o => o.id === state.selectedIds[0]);
        if (obj && obj.type !== 'path') {
          obj.type = 'path';
          obj.segments = [
            { x: obj.x, y: obj.y }, { x: obj.x + obj.width, y: obj.y },
            { x: obj.x + obj.width, y: obj.y + obj.height }, { x: obj.x, y: obj.y + obj.height }
          ];
          obj.closed = true; saveHistory(); renderScene(); renderLayers(); updateInspector();
        }
      }
    });

    const modalImport = document.getElementById('modal-import');
    const modalExport = document.getElementById('modal-export');

    document.getElementById('btn-import-modal').addEventListener('click', () => modalImport.classList.remove('hidden'));
    document.getElementById('btn-export-modal').addEventListener('click', () => modalExport.classList.remove('hidden'));

    document.querySelectorAll('.btn-close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        modalImport.classList.add('hidden'); modalExport.classList.add('hidden');
      });
    });

    function loadSample(formatName, color) {
      const sampleObj = {
        id: 'sample-' + formatName + '-' + Date.now(), type: 'path',
        x: 200, y: 150, width: 300, height: 200, rotation: 0,
        fill: color, stroke: '#ffffff', strokeWidth: 2,
        segments: [
          { x: 200, y: 250 }, { x: 350, y: 150 }, { x: 500, y: 250 }, { x: 350, y: 350 }
        ],
        closed: true, visible: true, locked: false
      };
      state.objects.push(sampleObj); state.selectedIds = [sampleObj.id];
      modalImport.classList.add('hidden');
      saveHistory(); renderScene(); renderLayers(); updateInspector();
    }

    document.getElementById('import-sample-ai').addEventListener('click', () => loadSample('ai', '#2563eb'));
    document.getElementById('import-sample-cdr').addEventListener('click', () => loadSample('cdr', '#16a34a'));
    document.getElementById('import-sample-pdf').addEventListener('click', () => loadSample('pdf', '#dc2626'));
    document.getElementById('import-sample-dxf').addEventListener('click', () => loadSample('dxf', '#9333ea'));

    document.getElementById('btn-do-export').addEventListener('click', () => {
      const fmt = document.getElementById('export-format').value;
      const jsonStr = JSON.stringify(state.objects, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `vectrclean-art.${fmt}`; a.click();
      modalExport.classList.add('hidden');
    });

    window.addEventListener('DOMContentLoaded', () => {
      initDefaultObjects(); renderScene(); renderLayers(); updateInspector();
    });
    // Fallback if DOMContentLoaded already fired
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initDefaultObjects(); renderScene(); renderLayers(); updateInspector();
    }
  </script>
</body>
</html>
